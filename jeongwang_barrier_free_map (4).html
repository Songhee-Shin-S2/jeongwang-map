<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>🔍 정왕동 배리어 프리 인권 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --cream-bg: #FBF3E4;
    --wood-dark: #5F3E24;
    --wood-mid: #B9835A;
    --wood-mid-2: #C99566;
    --wood-light: #EAD0AC;
    --paper: #FFFBF3;
    --ink: #4A3527;
    --ink-soft: #8A7360;
    --red-accent: #DD5A4C;
    --red-soft: #FAE0DC;
    --green-accent: #5C8C6C;
    --green-soft: #E1EBDD;
    --gold: #C99A3B;
    --gold-soft: #F3E6C4;
    --shadow: 0 6px 16px rgba(95, 62, 36, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream-bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
  }

  body{
    background-image:
      repeating-linear-gradient(100deg, rgba(185,131,90,0.05) 0px, rgba(185,131,90,0.05) 2px, transparent 2px, transparent 60px),
      repeating-linear-gradient(10deg, rgba(185,131,90,0.04) 0px, rgba(185,131,90,0.04) 1px, transparent 1px, transparent 40px);
  }

  h1, h2, h3, .hand { font-family: 'Gaegu', 'Noto Sans KR', sans-serif; }

  /* ===== Header ===== */
  .app-header{
    background: linear-gradient(180deg, var(--wood-mid) 0%, var(--wood-dark) 100%);
    padding: 18px 20px 22px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 5;
  }
  .app-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-10px; height:10px;
    background: repeating-linear-gradient(-45deg, var(--wood-dark) 0 6px, var(--wood-mid) 6px 12px);
    opacity:0.35;
  }
  .app-header h1{
    color:#FFF7EA;
    font-size: 30px;
    margin: 0 0 4px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
    letter-spacing: 0.5px;
  }
  .app-header p{
    color: #F3E3CB;
    margin: 0;
    font-size: 14px;
    font-weight: 500;
  }
  .badge-count{
    display:inline-block; margin-top:8px; background:rgba(255,251,243,0.15);
    border:1px solid rgba(255,251,243,0.4); color:#FFF7EA; border-radius:999px;
    padding: 4px 14px; font-size:13px; font-weight:700; margin-right:6px;
  }
  .teacher-toggle{
    position:absolute; top:12px; right:14px;
    background: rgba(255,251,243,0.15); border:1px solid rgba(255,251,243,0.4);
    color:#FFF7EA; border-radius: 10px; padding: 5px 10px; font-size:12px;
    cursor:pointer; font-weight:700;
  }
  .conn-dot{
    position:absolute; top:14px; left:14px; width:10px; height:10px; border-radius:50%;
    background:#9A9A9A;
  }
  .conn-dot.online{ background:#6FCF97; }
  .conn-dot.offline{ background:#DD5A4C; }

  /* ===== Filter bar ===== */
  .filter-bar{
    display:flex; gap:10px; justify-content:center; align-items:center;
    padding: 12px 14px; background: var(--wood-light);
    flex-wrap: wrap;
    position: sticky; top:0; z-index: 10;
    border-bottom: 3px dashed var(--wood-mid);
  }
  .filter-btn{
    font-family:'Gaegu', sans-serif;
    font-size: 17px; font-weight:700; cursor:pointer;
    padding: 8px 18px; border-radius: 14px;
    border: 2px solid var(--wood-mid);
    background: var(--paper); color: var(--ink);
    transition: all .15s ease;
    box-shadow: 0 3px 0 var(--wood-mid);
  }
  .filter-btn:hover{ transform: translateY(-1px); }
  .filter-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-mid); }
  .filter-btn.active{ background: var(--wood-dark); color:#FFF7EA; border-color: var(--wood-dark); }
  .filter-btn.red.active{ background: var(--red-accent); border-color: var(--red-accent); }
  .filter-btn.green.active{ background: var(--green-accent); border-color: var(--green-accent); }

  .add-hint{
    font-size: 12.5px; color: var(--wood-dark); font-weight:500;
    background: rgba(255,251,243,0.6); padding:6px 12px; border-radius:10px;
    width: 100%; text-align:center; margin-top:2px;
  }

  /* ===== Layout ===== */
  .main-layout{
    display:grid;
    grid-template-columns: 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (min-width: 920px){
    .main-layout{ grid-template-columns: 1.6fr 1fr; align-items: start; }
  }

  #map{
    width: 100%;
    height: 62vh;
    min-height: 420px;
    border-bottom: 6px solid var(--wood-mid);
  }
  @media (min-width: 920px){
    #map{ height: calc(100vh - 150px); border-bottom:none; border-right: 6px solid var(--wood-mid); }
  }

  /* ===== Sidebar / list (corkboard) ===== */
  .sidebar{
    background:
      radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px) 0 0/14px 14px,
      #C79A64;
    padding: 16px 14px 40px;
    max-height: none;
  }
  @media (min-width: 920px){
    .sidebar{ max-height: calc(100vh - 150px); overflow-y: auto; }
  }
  .sidebar h2{
    color:#FFF7EA; font-size: 20px; margin: 2px 4px 12px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  .empty-msg{
    background: var(--paper); border-radius: 14px; padding: 24px 16px;
    text-align:center; color: var(--ink-soft); font-size: 14px;
    border: 2px dashed var(--wood-mid);
  }

  .report-card{
    position: relative;
    background: var(--paper);
    border-radius: 10px;
    padding: 12px 12px 10px;
    margin: 0 6px 22px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transform: rotate(var(--tilt, -1deg));
    transition: transform .15s ease;
    border: 1px solid rgba(95,62,36,0.08);
  }
  .report-card:hover{ transform: rotate(0deg) translateY(-2px); }
  .report-card:nth-child(odd){ --tilt: 1.2deg; }
  .report-card:nth-child(even){ --tilt: -1.4deg; }

  .pin-dot{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.35);
    border: 2px solid #FFF7EA;
  }
  .pin-dot.obstacle{ background: var(--red-accent); }
  .pin-dot.good{ background: var(--green-accent); }

  .washi{
    position:absolute; top:-8px; right:10px; width:44px; height:16px;
    background: rgba(233, 200, 150, 0.85);
    transform: rotate(6deg);
    border: 1px solid rgba(185,131,90,0.4);
  }

  .card-photo{
    width:100%; height:110px; object-fit:cover; border-radius:6px;
    background: var(--wood-light);
    display:block; margin-bottom:8px;
  }
  .card-photo.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size: 30px; color: var(--wood-mid);
  }
  .card-top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .card-place{ font-weight:700; font-size:15px; margin:0 0 2px; }
  .tag-row{ display:flex; gap:5px; flex-wrap:wrap; margin: 4px 0 6px; }
  .tag{
    font-size:11px; font-weight:700; padding: 2px 8px; border-radius: 999px;
  }
  .tag.type-obstacle{ background: var(--red-soft); color: #A63A2F; }
  .tag.type-good{ background: var(--green-soft); color: #3D6B4B; }
  .tag.group{ background: var(--wood-light); color: var(--wood-dark); }
  .tag.pending{ background: var(--gold-soft); color: #8A6416; }
  .card-desc{ font-size:12.5px; color: var(--ink-soft); line-height:1.4; margin: 0 0 6px; }
  .card-bottom-row{ display:flex; justify-content:space-between; align-items:center; }
  .like-mini{ font-size:12px; font-weight:700; color:#B4483C; }

  /* ===== Leaflet pin marker ===== */
  .pin-marker{
    width: 34px; height: 34px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 6px rgba(0,0,0,0.35);
    border: 2px solid #FFF7EA;
  }
  .pin-marker.obstacle{ background: var(--red-accent); }
  .pin-marker.good{ background: var(--green-accent); }
  .pin-marker span{ transform: rotate(45deg); font-size: 16px; }

  /* ===== Modal shared ===== */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(74,53,39,0.55);
    display:none; align-items:center; justify-content:center;
    z-index: 1000; padding: 16px;
    backdrop-filter: blur(1px);
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background: var(--paper);
    width: 100%; max-width: 420px;
    max-height: 88vh; overflow-y:auto;
    border-radius: 18px;
    padding: 20px 20px 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    border: 3px solid var(--wood-mid);
    position: relative;
  }
  .modal-box.wide{ max-width: 560px; }
  .modal-box h2{ margin: 0 0 14px; font-size: 22px; color: var(--wood-dark); }
  .close-x{
    position:absolute; top:10px; right:12px; background:none; border:none;
    font-size:22px; color: var(--wood-mid); cursor:pointer; font-weight:700;
  }

  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 13px; font-weight:700; color: var(--wood-dark); margin-bottom:4px; }
  .field input[type=text], .field input[type=password], .field select, .field textarea{
    width:100%; padding: 9px 10px; border-radius: 10px;
    border: 2px solid var(--wood-light); background:#fff;
    font-family:'Noto Sans KR', sans-serif; font-size: 14px; color: var(--ink);
  }
  .field textarea{ resize: vertical; min-height: 56px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline: none; border-color: var(--wood-mid);
  }

  .type-toggle{ display:flex; gap:10px; }
  .type-opt{
    flex:1; text-align:center; padding: 12px 6px; border-radius: 12px;
    border: 2px solid var(--wood-light); cursor:pointer; font-weight:700; font-size:14px;
    transition: all .15s;
  }
  .type-opt .em{ display:block; font-size: 22px; margin-bottom:2px; }
  .type-opt.obstacle.selected{ background: var(--red-soft); border-color: var(--red-accent); color:#A63A2F; }
  .type-opt.good.selected{ background: var(--green-soft); border-color: var(--green-accent); color:#3D6B4B; }

  .photo-upload{
    border: 2px dashed var(--wood-mid); border-radius: 12px;
    padding: 14px; text-align:center; cursor:pointer; position:relative;
    background: #FFF9EE; font-size: 13px; color: var(--ink-soft);
  }
  .photo-upload input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .photo-preview{ width:100%; max-height:140px; object-fit:cover; border-radius:10px; margin-top:8px; display:none; }

  .btn-row{ display:flex; gap:10px; margin-top: 6px; }
  .btn{
    flex:1; padding: 11px 10px; border-radius: 12px; border:none;
    font-family:'Gaegu', sans-serif; font-size:17px; font-weight:700; cursor:pointer;
  }
  .btn.primary{ background: var(--wood-dark); color:#FFF7EA; }
  .btn.ghost{ background: var(--wood-light); color: var(--wood-dark); }
  .btn.approve{ background: var(--green-accent); color:#fff; }
  .btn.reject{ background: var(--red-accent); color:#fff; }
  .btn.small{ padding: 7px 10px; font-size: 14px; }
  .btn.primary:disabled{ opacity:0.5; cursor:not-allowed; }

  /* detail modal specifics */
  .detail-photo{
    width:100%; height:190px; object-fit:cover; border-radius: 12px; margin-bottom: 12px;
    background: var(--wood-light);
  }
  .detail-photo.placeholder{ display:flex; align-items:center; justify-content:center; font-size:44px; color: var(--wood-mid); }
  .detail-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .detail-desc{ font-size: 14.5px; line-height:1.6; color: var(--ink); margin: 4px 0 16px; }
  .like-btn{
    width:100%; padding: 12px; border-radius: 14px; border: 2px solid var(--red-accent);
    background: var(--red-soft); color:#A63A2F; font-family:'Gaegu',sans-serif;
    font-size: 18px; font-weight:700; cursor:pointer; transition: transform .1s;
  }
  .like-btn:active{ transform: scale(0.97); }

  /* teacher panel */
  .teacher-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .teacher-tab{
    flex:1; text-align:center; padding:8px; border-radius:10px; cursor:pointer;
    border:2px solid var(--wood-light); font-weight:700; font-size:13px; color: var(--wood-dark);
  }
  .teacher-tab.active{ background: var(--wood-dark); color:#FFF7EA; border-color: var(--wood-dark); }
  .review-row{
    display:flex; gap:10px; align-items:flex-start; background:#FFF9EE;
    border:1px solid var(--wood-light); border-radius:12px; padding:10px; margin-bottom:10px;
  }
  .review-row img{ width:56px; height:56px; object-fit:cover; border-radius:8px; background: var(--wood-light); flex-shrink:0; }
  .review-info{ flex:1; min-width:0; }
  .review-info .rp{ font-weight:700; font-size:13.5px; margin:0 0 2px; }
  .review-info .rm{ font-size:11.5px; color: var(--ink-soft); margin:0 0 6px; }
  .review-btns{ display:flex; gap:6px; }

  .toast{
    position: fixed; bottom: 18px; left:50%; transform: translateX(-50%);
    background: var(--wood-dark); color:#FFF7EA; padding: 10px 18px;
    border-radius: 999px; font-size: 13px; font-weight:600;
    box-shadow: var(--shadow); z-index: 2000; opacity:0; pointer-events:none;
    transition: opacity .25s; max-width: 90vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  .leaflet-popup{ display:none !important; } /* we use our own detail modal instead */
</style>
</head>
<body>

  <div class="app-header">
    <div class="conn-dot" id="connDot" title="연결 상태"></div>
    <button class="teacher-toggle" id="teacherToggleBtn">🔑 선생님 모드</button>
    <h1>🔍 정왕동 배리어 프리 인권 지도</h1>
    <p>우리 동네를 걸으며 발견한 장애물과 착한 시설을 지도에 기록해 보아요</p>
    <span class="badge-count" id="countBadge">게시된 제보 0건</span>
    <span class="badge-count" id="pendingBadge" style="display:none;">승인 대기 0건</span>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all" id="fAll">전체 보기</button>
    <button class="filter-btn red" data-filter="obstacle" id="fBad">🔴 장애물만 보기</button>
    <button class="filter-btn green" data-filter="good" id="fGood">🟢 착한 시설만 보기</button>
    <div class="add-hint">💡 정왕동 지도 안을 클릭하면 새 제보를 남길 수 있어요 (선생님 승인 후 지도에 표시돼요)</div>
  </div>

  <div class="main-layout">
    <div id="map"></div>
    <div class="sidebar">
      <h2>📋 모둠별 제보 목록</h2>
      <div id="listArea"></div>
    </div>
  </div>

  <!-- Add report modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <button class="close-x" id="closeAdd">✕</button>
      <h2>🕵️ 새로운 제보 등록</h2>
      <div class="field">
        <label>어떤 종류의 제보인가요?</label>
        <div class="type-toggle">
          <div class="type-opt obstacle selected" id="typeObstacleBtn">
            <span class="em">🔴</span>아쉬운 장애물
          </div>
          <div class="type-opt good" id="typeGoodBtn">
            <span class="em">🟢</span>착한 배리어프리 시설
          </div>
        </div>
      </div>
      <div class="field">
        <label>모둠 이름</label>
        <input type="text" id="inputGroup" placeholder="예: 1모둠" maxlength="20" />
      </div>
      <div class="field">
        <label>카테고리</label>
        <select id="inputCategory">
          <option value="문턱/계단">문턱/계단</option>
          <option value="경사로">경사로</option>
          <option value="엘리베이터">엘리베이터</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="field">
        <label>장소명</label>
        <input type="text" id="inputPlace" placeholder="예: 정왕동 행복마트 앞" maxlength="30" />
      </div>
      <div class="field">
        <label>사진 올리기 (현장에서 직접 찍은 사진)</label>
        <div class="photo-upload" id="photoUploadWrap">
          <input type="file" id="inputPhoto" accept="image/*" capture="environment" />
          <span id="photoUploadText">📷 사진을 선택해 주세요</span>
        </div>
        <img class="photo-preview" id="photoPreview" />
      </div>
      <div class="field">
        <label>한 줄 설명</label>
        <textarea id="inputDesc" placeholder="어떤 점이 불편했나요? 또는 어떤 점이 좋았나요?" maxlength="80"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="cancelAdd">취소</button>
        <button class="btn primary" id="submitAdd">제보 등록하기</button>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="close-x" id="closeDetail">✕</button>
      <div id="detailPhotoWrap"></div>
      <div class="detail-tags" id="detailTags"></div>
      <h2 id="detailPlace" style="font-size:19px;"></h2>
      <div class="detail-desc" id="detailDesc"></div>
      <button class="like-btn" id="likeBtn">❤️ 공감해요 (<span id="likeCount">0</span>)</button>
    </div>
  </div>

  <!-- Teacher passcode modal -->
  <div class="modal-overlay" id="passModal">
    <div class="modal-box">
      <button class="close-x" id="closePass">✕</button>
      <h2>🔑 선생님 모드</h2>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="inputPass" placeholder="비밀번호 입력" />
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="cancelPass">취소</button>
        <button class="btn primary" id="submitPass">입장하기</button>
      </div>
    </div>
  </div>

  <!-- Teacher review panel -->
  <div class="modal-overlay" id="teacherModal">
    <div class="modal-box wide">
      <button class="close-x" id="closeTeacher">✕</button>
      <h2>🔑 선생님 관리 화면</h2>
      <div class="teacher-tabs">
        <div class="teacher-tab active" id="tabPending">승인 대기</div>
        <div class="teacher-tab" id="tabApproved">게시된 제보 관리</div>
      </div>
      <div id="teacherArea"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>

  var TEACHER_PASSCODE = '1234';

  var TYPE_META = {
    obstacle: { label:'아쉬운 장애물', emoji:'⚠️', color:'obstacle' },
    good:     { label:'착한 배리어프리 시설', emoji:'♿', color:'good' }
  };

  // ---------- State ----------
  var reports = []; // {id, type, group, category, place, desc, photo, lat, lng, likes, createdAt, status}
  var markers = {};
  var currentFilter = 'all';
  var pendingLatLng = null;
  var pendingType = 'obstacle';
  var pendingPhotoData = null;
  var isTeacher = false;
  var teacherTab = 'pending';

  // ---------- Map init ----------
  var map = L.map('map', { zoomControl: true }).setView(CENTER, 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.marker(CENTER, {
    icon: L.divIcon({
      className: '',
      html: '<div style="text-align:center;line-height:1;"><div style="font-size:26px;">🏫</div>' +
            '<div style="font-size:11px;font-weight:700;color:#5F3E24;background:#FFF7EA;border-radius:6px;padding:1px 4px;margin-top:2px;white-space:nowrap;">서해중</div></div>',
      iconSize:[60,44], iconAnchor:[30,26]
    })
  }).addTo(map);

  L.rectangle(
    [[BOUNDS.latMin, BOUNDS.lngMin],[BOUNDS.latMax, BOUNDS.lngMax]],
    { color:'#B9835A', weight:1, fillOpacity:0.03, dashArray:'6 6' }
  ).addTo(map);

  map.on('click', function(e){
    if(!inBounds(e.latlng)){
      showToast('정왕동 지도 범위 안에서만 제보할 수 있어요 🙂');
      return;
    }
    openAddModal(e.latlng);
  });

  function inBounds(latlng){
    return latlng.lat >= BOUNDS.latMin && latlng.lat <= BOUNDS.latMax &&
           latlng.lng >= BOUNDS.lngMin && latlng.lng <= BOUNDS.lngMax;
  }

  // ---------- Firebase 연결 상태 표시 ----------
  db.ref('.info/connected').on('value', function(snap){
    var dot = document.getElementById('connDot');
    if(snap.val() === true){
      dot.classList.add('online'); dot.classList.remove('offline');
      dot.title = '실시간 연결됨';
    } else {
      dot.classList.add('offline'); dot.classList.remove('online');
      dot.title = '연결 대기 중';
    }
  });

  // ---------- 실시간 데이터 구독 (읽기 + 상태 갱신을 한번에 처리) ----------
  reportsRef.on('value', function(snapshot){
    var val = snapshot.val() || {};
    reports = Object.keys(val).map(function(k){ return val[k]; });
    renderAll();

    // 상세 모달이 열려있는 경우 좋아요 숫자 등을 실시간으로 갱신
    if(currentDetailId){
      var r = reports.find(function(x){ return x.id === currentDetailId; });
      if(r) document.getElementById('likeCount').textContent = r.likes || 0;
    }
  }, function(err){
    showToast('데이터베이스 연결에 문제가 있어요. 새로고침 해주세요.');
  });

  // ---------- Storage helpers (Firebase Realtime Database) ----------
  function saveReport(r){
    return reportsRef.child(r.id).set(r).then(function(){ return true; }).catch(function(){
      showToast('저장 중 오류가 발생했어요.');
      return false;
    });
  }

  function deleteReport(id){
    return reportsRef.child(id).remove().then(function(){ return true; }).catch(function(){
      showToast('삭제 중 오류가 발생했어요.');
      return false;
    });
  }

  function incrementLike(id){
    // transaction: 여러 명이 동시에 눌러도 안전하게 누적
    return reportsRef.child(id).child('likes').transaction(function(cur){
      return (cur || 0) + 1;
    });
  }

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  // ---------- Rendering (학생 화면: 승인된 것만 노출) ----------
  function approvedReports(){ return reports.filter(function(r){ return r.status === 'approved'; }); }
  function pendingReports(){ return reports.filter(function(r){ return r.status !== 'approved'; }); }

  function visibleReports(){
    var base = approvedReports();
    if(currentFilter === 'all') return base;
    return base.filter(function(r){ return r.type === currentFilter; });
  }

  function renderAll(){
    renderMarkers();
    renderList();
    document.getElementById('countBadge').textContent = '게시된 제보 ' + approvedReports().length + '건';
    var pb = document.getElementById('pendingBadge');
    var pcount = pendingReports().length;
    if(isTeacher){
      pb.style.display = 'inline-block';
      pb.textContent = '승인 대기 ' + pcount + '건';
    } else {
      pb.style.display = 'none';
    }
    if(document.getElementById('teacherModal').classList.contains('show')){
      renderTeacherArea();
    }
  }

  function renderMarkers(){
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    visibleReports().forEach(function(r){
      var meta = TYPE_META[r.type];
      var icon = L.divIcon({
        className: '',
        html: '<div class="pin-marker ' + meta.color + '"><span>' + meta.emoji + '</span></div>',
        iconSize:[34,34], iconAnchor:[17,34]
      });
      var m = L.marker([r.lat, r.lng], { icon: icon }).addTo(map);
      m.on('click', function(){ openDetailModal(r.id); });
      markers[r.id] = m;
    });
  }

  function renderList(){
    var area = document.getElementById('listArea');
    var list = visibleReports().slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    if(list.length === 0){
      area.innerHTML = '<div class="empty-msg">아직 게시된 제보가 없어요.<br>지도를 클릭해서 첫 제보를 남겨보세요! 🧐</div>';
      return;
    }
    area.innerHTML = list.map(function(r){
      var meta = TYPE_META[r.type];
      var photoHtml = r.photo
        ? '<img class="card-photo" src="' + r.photo + '" />'
        : '<div class="card-photo placeholder">' + meta.emoji + '</div>';
      return (
        '<div class="report-card" data-id="' + r.id + '">' +
          '<div class="pin-dot ' + meta.color + '"></div>' +
          '<div class="washi"></div>' +
          photoHtml +
          '<div class="card-top-row"><p class="card-place">' + escapeHtml(r.place) + '</p></div>' +
          '<div class="tag-row">' +
            '<span class="tag type-' + meta.color + '">' + meta.emoji + ' ' + meta.label + '</span>' +
            '<span class="tag group">' + escapeHtml(r.category) + '</span>' +
            '<span class="tag group">' + escapeHtml(r.group) + '</span>' +
          '</div>' +
          '<p class="card-desc">' + escapeHtml(r.desc) + '</p>' +
          '<div class="card-bottom-row"><span class="like-mini">❤️ ' + (r.likes || 0) + '</span></div>' +
        '</div>'
      );
    }).join('');

    area.querySelectorAll('.report-card').forEach(function(card){
      card.addEventListener('click', function(){
        var id = card.getAttribute('data-id');
        var r = reports.find(function(x){ return x.id === id; });
        if(!r) return;
        map.flyTo([r.lat, r.lng], 18, { duration: 0.6 });
        setTimeout(function(){ openDetailModal(id); }, 300);
      });
    });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------- Filters ----------
  document.getElementById('fAll').addEventListener('click', function(){ setFilter('all'); });
  document.getElementById('fBad').addEventListener('click', function(){ setFilter('obstacle'); });
  document.getElementById('fGood').addEventListener('click', function(){ setFilter('good'); });
  function setFilter(f){
    currentFilter = f;
    ['fAll','fBad','fGood'].forEach(function(id){ document.getElementById(id).classList.remove('active'); });
    if(f === 'all') document.getElementById('fAll').classList.add('active');
    if(f === 'obstacle') document.getElementById('fBad').classList.add('active');
    if(f === 'good') document.getElementById('fGood').classList.add('active');
    renderAll();
  }

  // ---------- Add modal ----------
  var addModal = document.getElementById('addModal');
  function openAddModal(latlng){
    pendingLatLng = latlng;
    pendingType = 'obstacle';
    pendingPhotoData = null;
    document.getElementById('typeObstacleBtn').classList.add('selected');
    document.getElementById('typeGoodBtn').classList.remove('selected');
    document.getElementById('inputGroup').value = '';
    document.getElementById('inputCategory').value = '문턱/계단';
    document.getElementById('inputPlace').value = '';
    document.getElementById('inputDesc').value = '';
    document.getElementById('inputPhoto').value = '';
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoUploadText').textContent = '📷 사진을 선택해 주세요';
    addModal.classList.add('show');
  }
  function closeAddModal(){ addModal.classList.remove('show'); }
  document.getElementById('closeAdd').addEventListener('click', closeAddModal);
  document.getElementById('cancelAdd').addEventListener('click', closeAddModal);
  addModal.addEventListener('click', function(e){ if(e.target === addModal) closeAddModal(); });

  document.getElementById('typeObstacleBtn').addEventListener('click', function(){
    pendingType = 'obstacle';
    this.classList.add('selected');
    document.getElementById('typeGoodBtn').classList.remove('selected');
  });
  document.getElementById('typeGoodBtn').addEventListener('click', function(){
    pendingType = 'good';
    this.classList.add('selected');
    document.getElementById('typeObstacleBtn').classList.remove('selected');
  });

  document.getElementById('inputPhoto').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    compressImage(file, 640, 0.7).then(function(dataUrl){
      pendingPhotoData = dataUrl;
      var preview = document.getElementById('photoPreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      document.getElementById('photoUploadText').textContent = '✅ 사진이 선택되었어요';
    }).catch(function(){
      showToast('사진을 불러오지 못했어요.');
    });
  });

  function compressImage(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('submitAdd').addEventListener('click', async function(){
    var group = document.getElementById('inputGroup').value.trim();
    var place = document.getElementById('inputPlace').value.trim();
    var desc = document.getElementById('inputDesc').value.trim();
    var category = document.getElementById('inputCategory').value;

    if(!group || !place || !desc){
      showToast('모둠 이름, 장소명, 한 줄 설명을 모두 입력해 주세요.');
      return;
    }
    if(!pendingLatLng){
      showToast('지도를 먼저 클릭해서 위치를 선택해 주세요.');
      return;
    }

    var btn = document.getElementById('submitAdd');
    btn.disabled = true;
    btn.textContent = '등록 중...';

    var newReport = {
      id: 'r_' + Date.now() + '_' + Math.floor(Math.random()*10000),
      type: pendingType,
      group: group,
      category: category,
      place: place,
      desc: desc,
      photo: pendingPhotoData,
      lat: pendingLatLng.lat,
      lng: pendingLatLng.lng,
      likes: 0,
      createdAt: Date.now(),
      status: 'pending'
    };
    var ok = await saveReport(newReport);
    if(ok){
      closeAddModal();
      showToast('제보가 접수되었어요! 선생님 승인 후 지도에 표시돼요 🙌');
    }
    btn.disabled = false;
    btn.textContent = '제보 등록하기';
  });

  // ---------- Detail modal ----------
  var detailModal = document.getElementById('detailModal');
  var currentDetailId = null;

  function openDetailModal(id){
    var r = reports.find(function(x){ return x.id === id; });
    if(!r) return;
    currentDetailId = id;
    var meta = TYPE_META[r.type];

    var photoWrap = document.getElementById('detailPhotoWrap');
    photoWrap.innerHTML = r.photo
      ? '<img class="detail-photo" src="' + r.photo + '" />'
      : '<div class="detail-photo placeholder">' + meta.emoji + '</div>';

    document.getElementById('detailTags').innerHTML =
      '<span class="tag type-' + meta.color + '">' + meta.emoji + ' ' + meta.label + '</span>' +
      '<span class="tag group">' + escapeHtml(r.category) + '</span>' +
      '<span class="tag group">' + escapeHtml(r.group) + '</span>';

    document.getElementById('detailPlace').textContent = r.place;
    document.getElementById('detailDesc').textContent = r.desc;
    document.getElementById('likeCount').textContent = r.likes || 0;

    detailModal.classList.add('show');
  }
  function closeDetailModal(){ detailModal.classList.remove('show'); currentDetailId = null; }
  document.getElementById('closeDetail').addEventListener('click', closeDetailModal);
  detailModal.addEventListener('click', function(e){ if(e.target === detailModal) closeDetailModal(); });

  document.getElementById('likeBtn').addEventListener('click', function(){
    if(!currentDetailId) return;
    incrementLike(currentDetailId);
  });

  // ---------- Teacher mode ----------
  var passModal = document.getElementById('passModal');
  var teacherModal = document.getElementById('teacherModal');

  document.getElementById('teacherToggleBtn').addEventListener('click', function(){
    if(isTeacher){
      openTeacherPanel();
    } else {
      document.getElementById('inputPass').value = '';
      passModal.classList.add('show');
    }
  });
  document.getElementById('closePass').addEventListener('click', function(){ passModal.classList.remove('show'); });
  document.getElementById('cancelPass').addEventListener('click', function(){ passModal.classList.remove('show'); });
  passModal.addEventListener('click', function(e){ if(e.target === passModal) passModal.classList.remove('show'); });

  document.getElementById('submitPass').addEventListener('click', function(){
    var val = document.getElementById('inputPass').value;
    if(val === TEACHER_PASSCODE){
      isTeacher = true;
      passModal.classList.remove('show');
      renderAll();
      openTeacherPanel();
      showToast('선생님 모드로 전환되었어요.');
    } else {
      showToast('비밀번호가 올바르지 않아요.');
    }
  });

  document.getElementById('closeTeacher').addEventListener('click', function(){ teacherModal.classList.remove('show'); });
  teacherModal.addEventListener('click', function(e){ if(e.target === teacherModal) teacherModal.classList.remove('show'); });

  document.getElementById('tabPending').addEventListener('click', function(){ teacherTab='pending'; updateTeacherTabs(); renderTeacherArea(); });
  document.getElementById('tabApproved').addEventListener('click', function(){ teacherTab='approved'; updateTeacherTabs(); renderTeacherArea(); });
  function updateTeacherTabs(){
    document.getElementById('tabPending').classList.toggle('active', teacherTab==='pending');
    document.getElementById('tabApproved').classList.toggle('active', teacherTab==='approved');
  }

  function openTeacherPanel(){
    teacherTab = 'pending';
    updateTeacherTabs();
    renderTeacherArea();
    teacherModal.classList.add('show');
  }

  function renderTeacherArea(){
    var area = document.getElementById('teacherArea');
    var list = (teacherTab === 'pending' ? pendingReports() : approvedReports())
      .slice().sort(function(a,b){ return b.createdAt - a.createdAt; });

    if(list.length === 0){
      area.innerHTML = '<div class="empty-msg">' + (teacherTab==='pending' ? '승인 대기 중인 제보가 없어요.' : '게시된 제보가 없어요.') + '</div>';
      return;
    }

    area.innerHTML = list.map(function(r){
      var meta = TYPE_META[r.type];
      var photoHtml = r.photo ? '<img src="' + r.photo + '" />' : '<img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2756%27/%3E" />';
      var actionBtns = teacherTab === 'pending'
        ? '<button class="btn approve small" data-act="approve" data-id="' + r.id + '">✅ 승인</button>' +
          '<button class="btn reject small" data-act="reject" data-id="' + r.id + '">❌ 거절</button>'
        : '<button class="btn reject small" data-act="delete" data-id="' + r.id + '">🗑 삭제</button>';
      return (
        '<div class="review-row">' +
          photoHtml +
          '<div class="review-info">' +
            '<p class="rp">' + meta.emoji + ' ' + escapeHtml(r.place) + '</p>' +
            '<p class="rm">' + escapeHtml(r.group) + ' · ' + escapeHtml(r.category) + ' · ' + escapeHtml(r.desc) + '</p>' +
            '<div class="review-btns">' + actionBtns + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    area.querySelectorAll('button[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');
        btn.disabled = true;

        if(act === 'approve'){
          reportsRef.child(id).child('status').set('approved').then(function(){
            showToast('제보를 승인했어요.');
          });
        } else if(act === 'reject'){
          deleteReport(id).then(function(){ showToast('제보를 거절(삭제)했어요.'); });
        } else if(act === 'delete'){
          if(!confirm('이 제보를 정말 삭제할까요?')) { btn.disabled = false; return; }
          deleteReport(id).then(function(){ showToast('제보를 삭제했어요.'); });
        }
        // Realtime listener가 데이터 변경을 감지해 자동으로 다시 그려줍니다.
      });
    });
  }
})();
</script>
</body>
</html>
